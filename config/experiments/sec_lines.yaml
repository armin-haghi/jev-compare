# Statement-mapping run settings: which models answer, and how. The dataset is chosen with --dataset.
# Every model is called through the Vercel AI Gateway; prices come from the gateway catalog when the run starts.
case: sec_lines
case_config: cases/sec_lines/case.yaml
prompts: cases/sec_lines/prompts.yaml
record_concurrency: 4
attempts: 3
timeout_seconds: 120

# Keyword rules: free and deterministic. Set to false in a run that only adds models.
rules: true

# Decision models answer through the System One API. request_model is the API's name when it differs from the catalog ID.
decision_models:
  - model: typesafe-ai/jev
    request_model: jev

# Chat models answer through chat completions. Add any gateway model by its ID. Each runs at the lowest
# reasoning effort its catalog entry accepts; max_tokens covers reasoning and the answer.
chat_models:
  - model: google/gemini-3.8-flash
    reasoning_effort: low
    max_tokens: 4096
  - model: openai/gpt-6-luna
    reasoning_effort: none
    max_tokens: 4096
  - model: anthropic/claude-haiku-4.5   # reasoning is off unless requested
    max_tokens: 4096

context_regimes:
  - label_only
  - with_context

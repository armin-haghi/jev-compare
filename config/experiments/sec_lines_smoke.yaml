# Initial live smoke excludes the frontier tier at the user's request.
case: sec_lines
case_config: cases/sec_lines/case.yaml
prompts: cases/sec_lines/prompts.yaml
pricing: config/pricing.yaml
seed: 20261001
record_concurrency: 1
question_concurrency: 8
attempts: 3
timeout_seconds: 120
bootstrap_samples: 2000
conventional_llm:
  small:
    provider: vercel
    model: openai/gpt-5-mini
    temperature: null
    reasoning_effort: minimal
    max_tokens: 4096
  frontier:
    provider: vercel
    model: anthropic/claude-sonnet-4.6
    temperature: 0
    max_tokens: 4096
jev:
  provider: vercel
  model: typesafe-ai/jev
  request_model: jev
  base_url: https://ai-gateway.vercel.sh/typesafe
methods:
- rules_baseline
- direct_llm
- decomposed_llm_matrix
- decomposed_llm_parallel
- jev_direct
- jev_composite_concurrent
- jev_composite_fanout
context_regimes:
- label_only
- with_context
profiles:
  small:
    records_per_line: 20
    composite_records: 200
    repeat_records: 100
    repeat_count: 2
    shuffle_records: 100
  full:
    records_per_line: 300
    composite_records: 1500
    repeat_records: 500
    repeat_count: 3
    shuffle_records: 500
    minimum_eligible: 50
llm_tiers:
- small

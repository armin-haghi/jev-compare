case_id: sec_lines
description: Map a company's financial statement wording to 29 standard lines using its filed accounting tag as the answer key.
fiscal_years: [2021, 2022, 2023, 2024, 2025]
quarter_start: 2021q1
quarter_end: 2026q1
raw_dir: data/raw/sec_lines
processed_dir: data/processed/sec_lines
descriptions:
  revenue: Income earned from the company's ordinary sales and services.
  cost_of_revenue: Direct costs of producing the goods and services sold.
  gross_profit: Revenue remaining after the direct costs of sales.
  research_development: Costs of researching and developing products and technology.
  sga: Selling and general administrative costs of operating the business.
  depreciation_amortization: Charges allocating the cost of tangible and intangible assets over time.
  other_operating: Other income or costs included in operating profit.
  operating_income: Profit or loss from ordinary operations before non-operating items and tax.
  interest_income: Income earned from lending money or interest-bearing investments.
  interest_expense: Interest costs incurred on borrowings.
  other_nonoperating: A component of non-operating income or expense distinct from the total.
  total_nonoperating: Total income or expense outside operations, including interest when present.
  income_tax: Income tax expense or benefit for the period.
  net_income: The bottom-line profit or loss after expenses and income tax.
  cash: Cash and cash equivalents, including restricted cash when reported together.
  short_term_investments: Investments expected to be realised within the current operating cycle.
  receivables: Current amounts customers and other parties owe the company.
  inventory: Goods and materials held for sale or production.
  other_current_assets: Current assets other than cash, investments, receivables and inventory.
  ppe: Property, plant and equipment after accumulated depreciation.
  goodwill_intangibles: Goodwill or other intangible assets reported separately or together.
  other_noncurrent_assets: Long-term assets outside property, goodwill and intangible categories.
  accounts_payable: Amounts owed to suppliers for goods and services already received.
  accrued_liabilities: Expenses incurred but not yet paid.
  short_term_debt: Borrowings and portions of long-term debt due in the current period.
  other_current_liabilities: Current obligations outside supplier payables, accruals and debt.
  long_term_debt: Borrowings due beyond the current period.
  other_noncurrent_liabilities: Long-term obligations outside long-term borrowings.
  total_equity: The owners' residual interest in assets after liabilities.
metadata:
  default: {signs: [positive, zero], range: [0, 1]}
  revenue: {signs: [positive], range: [0.8, 1.2]}
  gross_profit: {signs: [positive, negative, zero], range: [0, 1]}
  operating_income: {signs: [positive, negative, zero], range: [0, 1]}
  net_income: {signs: [positive, negative, zero], range: [0, 1]}
  other_operating: {signs: [positive, negative, zero], range: [0, 0.5]}
  other_nonoperating: {signs: [positive, negative, zero], range: [0, 0.5]}
  total_nonoperating: {signs: [positive, negative, zero], range: [0, 0.5]}
  income_tax: {signs: [positive, negative, zero], range: [0, 0.5]}
  total_equity: {signs: [positive, negative, zero], range: [0, 1]}

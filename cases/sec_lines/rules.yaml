# Frozen template-derived rules; these are not fitted to benchmark records.
keywords:
  revenue: ['^(total )?(net )?(revenues?|sales)( net)?$']
  cost_of_revenue: ['cost of (goods|revenue|sales|services)']
  gross_profit: ['gross (profit|margin)']
  research_development: ['research and development']
  sga: ['selling general and administrative']
  depreciation_amortization: ['^depreciation', '^amortization', '^amortisation']
  other_operating: ['other operating']
  operating_income: ['^(income|loss) from operations', '^operating (income|loss|profit)']
  interest_income: ['interest income']
  interest_expense: ['interest expense']
  other_nonoperating: ['other non operating', 'other nonoperating']
  total_nonoperating: ['total non operating', 'total nonoperating']
  income_tax: ['income tax', 'provision for.*tax', 'benefit from.*tax']
  net_income: ['^net (income|loss|earnings)']
  cash: ['^cash and cash equivalents', '^cash cash equivalents']
  short_term_investments: ['short term investments', 'marketable securities']
  receivables: ['accounts receivable', '^receivables']
  inventory: ['^inventor']
  other_current_assets: ['other current assets', 'prepaid.*current assets']
  ppe: ['property plant and equipment']
  goodwill_intangibles: ['goodwill', 'intangible assets']
  other_noncurrent_assets: ['other noncurrent assets', 'other non current assets', 'other long term assets']
  accounts_payable: ['^accounts payable$']
  accrued_liabilities: ['^accrued (liabilities|expenses)$']
  short_term_debt: ['short term (debt|borrowings)', 'current portion of long term debt']
  other_current_liabilities: ['^other current liabilities$']
  long_term_debt: ['^long term debt( net)?$']
  other_noncurrent_liabilities: ['other noncurrent liabilities', 'other non current liabilities', 'other long term liabilities']
  total_equity: ['^(total )?(stockholders|shareholders|owners) equity']
position:
  enabled: true
